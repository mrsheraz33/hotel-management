<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookings - Hotel System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="bookings" data-title="Bookings">
<div id="page">
  <div class="toolbar">
    <div class="chips" id="filters">
      <button class="chip active" data-f="all">All</button>
      <button class="chip" data-f="pending">Pending</button>
      <button class="chip" data-f="confirmed">Confirmed</button>
      <button class="chip" data-f="checkedin">Checked In</button>
      <button class="chip" data-f="cancelled">Cancelled</button>
    </div>
    <button class="btn btn-primary" id="addBtn"><i class="fa-solid fa-plus"></i> New Booking</button>
  </div>
  <div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Guest</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Nights</th><th>Status</th><th class="num">Amount</th><th>Actions</th></tr></thead>
    <tbody id="bookBody"></tbody>
  </table></div></div>

  <div class="modal-backdrop" id="bookModal">
    <div class="modal">
      <div class="modal-head"><h3 id="bookModalTitle">New Booking</h3><button class="icon-btn" data-close aria-label="Close">&times;</button></div>
      <form id="bookForm">
        <div class="form-grid">
          <div class="field"><label>Guest Name</label><input id="fGuest" required></div>
          <div class="field"><label>Phone</label><input id="fPhone" required></div>
          <div class="field full"><label>Room</label><select id="fRoom" required></select></div>
          <div class="field"><label>Check-in</label><input id="fIn" type="date" required></div>
          <div class="field"><label>Check-out</label><input id="fOut" type="date" required></div>
          <div class="field full"><div class="calc"><span>Nights: <b id="cNights">0</b></span><span>Total: <b id="cAmount">Rs 0</b></span></div></div>
          <div class="field full"><label>Status</label>
            <select id="fStatus"><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="checkedin">Checked In</option><option value="cancelled">Cancelled</option></select></div>
        </div>
        <div class="form-error" id="bookError"></div>
        <div class="modal-foot">
          <button type="button" class="btn btn-light" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Save Booking</button>
        </div>
      </form>
    </div>
  </div>
</div>
  <script src="js/api.js"></script>
  <script src="js/bookings.js"></script>
</body>
</html>
