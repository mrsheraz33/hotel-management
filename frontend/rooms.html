<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rooms - Hotel System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="rooms" data-title="Rooms">
<div id="page">
  <div class="toolbar">
    <div class="chips" id="filters">
      <button class="chip active" data-f="all">All</button>
      <button class="chip" data-f="available">Available</button>
      <button class="chip" data-f="booked">Booked</button>
      <button class="chip" data-f="cleaning">Cleaning</button>
      <button class="chip" data-f="maintenance">Maintenance</button>
    </div>
    <button class="btn btn-primary" id="addBtn"><i class="fa-solid fa-plus"></i> Add Room</button>
  </div>
  <div class="rooms-grid" id="roomsGrid"></div>

  <div class="modal-backdrop" id="roomModal">
    <div class="modal">
      <div class="modal-head"><h3 id="roomModalTitle">Add Room</h3><button class="icon-btn" data-close aria-label="Close">&times;</button></div>
      <form id="roomForm">
        <div class="form-grid">
          <div class="field"><label>Room Number</label><input id="fNumber" required></div>
          <div class="field"><label>Type</label>
            <select id="fType"><option>Single</option><option>Double</option><option>Deluxe</option><option>Suite</option></select></div>
          <div class="field"><label>Price per night (Rs)</label><input id="fPrice" type="number" min="0" required></div>
          <div class="field"><label>Capacity</label><input id="fCapacity" type="number" min="1" required></div>
          <div class="field"><label>Status</label>
            <select id="fStatus"><option value="available">Available</option><option value="booked">Booked</option><option value="cleaning">Cleaning</option><option value="maintenance">Maintenance</option></select></div>
          <div class="field"><label>Floor</label><input id="fFloor"></div>
          <div class="field full"><label>Amenities</label><input id="fAmenities" placeholder="WiFi, AC, TV"></div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-light" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Save Room</button>
        </div>
      </form>
    </div>
  </div>
</div>
  <script src="js/api.js"></script>
  <script src="js/rooms.js"></script>
</body>
</html>
