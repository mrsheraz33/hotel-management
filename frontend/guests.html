<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guests - Hotel System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="guests" data-title="Guests">
<div id="page">
  <div class="toolbar">
    <input class="search" id="search" placeholder="Search by name or phone">
    <button class="btn btn-primary" id="addBtn"><i class="fa-solid fa-plus"></i> Add Guest</button>
  </div>
  <div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Name</th><th>Phone</th><th>CNIC</th><th>Address</th><th>Actions</th></tr></thead>
    <tbody id="guestBody"></tbody>
  </table></div></div>

  <div class="modal-backdrop" id="guestModal">
    <div class="modal">
      <div class="modal-head"><h3 id="guestModalTitle">Add Guest</h3><button class="icon-btn" data-close aria-label="Close">&times;</button></div>
      <form id="guestForm">
        <div class="form-grid">
          <div class="field"><label>Name</label><input id="fName" required></div>
          <div class="field"><label>Phone</label><input id="fPhone" required></div>
          <div class="field"><label>CNIC</label><input id="fCnic" placeholder="35202-1234567-1"></div>
          <div class="field"><label>Email</label><input id="fEmail" type="email"></div>
          <div class="field full"><label>Address</label><input id="fAddress"></div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-light" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Save Guest</button>
        </div>
      </form>
    </div>
  </div>
</div>
  <script src="js/api.js"></script>
  <script src="js/guests.js"></script>
</body>
</html>
