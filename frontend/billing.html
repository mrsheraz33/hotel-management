<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Billing - Hotel System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="billing" data-title="Billing">
<div id="page">
  <div class="stats">
    <div class="stat"><div class="ico blue"><i class="fa-solid fa-file-invoice"></i></div><div><small>Total Invoices</small><b id="sCount">-</b></div></div>
    <div class="stat"><div class="ico green"><i class="fa-solid fa-circle-check"></i></div><div><small>Total Paid</small><b id="sPaid">-</b></div></div>
    <div class="stat"><div class="ico orange"><i class="fa-solid fa-hourglass-half"></i></div><div><small>Total Unpaid</small><b id="sUnpaid">-</b></div></div>
  </div>
  <div class="toolbar">
    <div class="chips" id="filters">
      <button class="chip active" data-f="all">All</button>
      <button class="chip" data-f="paid">Paid</button>
      <button class="chip" data-f="unpaid">Unpaid</button>
    </div>
    <button class="btn btn-primary" id="addBtn"><i class="fa-solid fa-plus"></i> Create Bill</button>
  </div>
  <div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Invoice #</th><th>Guest</th><th>Room</th><th>Date</th><th class="num">Amount</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="billBody"></tbody>
  </table></div></div>

  <div class="modal-backdrop" id="billModal">
    <div class="modal">
      <div class="modal-head"><h3>Create Bill</h3><button class="icon-btn" data-close aria-label="Close">&times;</button></div>
      <form id="billForm">
        <div class="form-grid">
          <div class="field full"><label>Guest Name</label><input id="fGuest" required></div>
          <div class="field full"><label>Room</label><select id="fRoom"></select></div>
          <div class="field"><label>Nights</label><input id="fNights" type="number" min="0" value="1"></div>
          <div class="field"><label>Extra Charges (Rs)</label><input id="fExtra" type="number" min="0" value="0"></div>
          <div class="field full"><label>Payment Status</label>
            <select id="fStatus"><option value="unpaid">Unpaid</option><option value="paid">Paid</option></select></div>
          <div class="field full"><div class="calc"><span>Total</span><b id="cTotal">Rs 0</b></div></div>
        </div>
        <div class="form-error" id="billError"></div>
        <div class="modal-foot">
          <button type="button" class="btn btn-light" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Create Bill</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="viewModal">
    <div class="modal wide">
      <div class="modal-head no-print"><h3>Invoice</h3><button class="icon-btn" data-close aria-label="Close">&times;</button></div>
      <div id="invoiceArea"></div>
      <div class="modal-foot no-print">
        <button type="button" class="btn btn-light" data-close>Close</button>
        <button type="button" class="btn btn-primary" id="printBtn"><i class="fa-solid fa-print"></i> Print</button>
      </div>
    </div>
  </div>
</div>
  <script src="js/api.js"></script>
  <script src="js/billing.js"></script>
</body>
</html>
